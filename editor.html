<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio · 网页排版编辑器</title><link rel="stylesheet" href="css/editor.css"></head><body><header class="bar"><a class="brand" href="index.html">WJY<span>✦</span> Studio</a><div class="project"><select id="pageSelect" aria-label="切换页面"></select><button id="newPage">＋ 新建页面</button><button id="renamePage">重命名</button></div><div class="actions"><span id="saveState">已保存</span><button id="preview">预览</button><button id="publish" class="publish">发布到网站</button><button id="export">导出项目</button><label class="import">导入项目<input id="importFile" type="file" accept="application/json"></label></div></header><main><aside class="assets"><div class="panel-title">美术资产 <button id="uploadBtn">＋ 上传</button><input id="assetInput" type="file" accept="image/*,video/*" multiple hidden></div><p class="hint">图片和视频会在所有页面共用</p><div id="assetList" class="asset-list"></div></aside><section class="stage-wrap"><div id="stage" class="stage"><div class="empty">从左侧点击素材添加到画布</div></div></section><aside class="layers"><div class="panel-title">图层 <span id="layerCount">0</span></div><p class="hint">拖动调整层级 · 双击重命名</p><div id="layerList" class="layer-list"></div></aside></main><div id="previewModal" class="modal"><div class="preview-head"><b>预览</b><button id="closePreview">×</button></div><div id="previewStage" class="preview-stage"></div></div><div id="toast" class="toast"></div><script src="js/editor.js"></script></body></html>
